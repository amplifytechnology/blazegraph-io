[package]
name = "blazegraph-io-core"
# CR-87 stopgap retro-bump 0.2.2 → 0.3.0: output materially changed since
# 0.2.2 (Block A content-body identity + CR-84 node-ID re-key). The graph
# cache key now tracks this (cache::versions::BLAZEGRAPH_VERSION =
# crate::VERSION), so the bump invalidates stale entries. NOT a designed
# release scheme — the coherent core+CLI version overhaul is deferred to
# CR-85 (ledger item 6).
version = "0.3.0"
edition = "2021"
description = "Core library for semantic document graph processing — parse PDFs into structured, queryable graphs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AmplifyTechnology/blazegraph-io"
homepage = "https://blazegraph.io"
keywords = ["pdf", "document", "graph", "rag", "parsing"]
categories = ["text-processing", "parser-implementations"]
exclude = ["test_fixtures/"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"

# XML parsing for Tika XHTML and the OOXML (DOCX) body walk.
quick-xml = "0.31"

# OOXML container (DOCX is a ZIP). `default-features = false` + only the
# `deflate` codec keeps the dependency surface minimal — we read a
# well-understood subset (`word/document.xml`, `word/styles.xml`) and
# never write archives. See the C1 DOCX-channel handoff.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Unicode NFKC normalization for compat-decomposable glyphs (ligatures,
# non-breaking space, etc.) — folds chars that look identical on screen
# but differ in bytes, so embeddings/search/AI see what readers see.
unicode-normalization = "0.1"

# Cryptographic hashing for caching
sha2 = "0.10"

# CommonMark parser — drives the bgraph.md reverse parser (B3 of the
# MD+DOCX format expansion flow) and the generic-markdown channel (B6).
# B6 enables the `simd` feature implicitly via default features removed
# — we keep `default-features = false` so the bgraph.md round-trip
# remains deterministic across builds.
pulldown-cmark = { version = "0.10", default-features = false }

# Generic markdown channel (B6 of MD+DOCX flow): YAML frontmatter
# pre-pass. `gray_matter` handles the `---\n…\n---\n` detection and
# YAML decoding; its result (a gray_matter `Pod`) is converted to
# `serde_json::Value` at the parse boundary so the YAML lib coupling
# never leaks beyond `preprocessors::md::frontmatter`. See the B6 AAR
# for why `gray_matter` is the named lib (and how the handoff's named
# `serde_norway` doesn't compose with gray_matter — gray_matter uses
# its own internal YAML engine, not a pluggable one).
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }

# JNI for Java interop (when jni-backend feature enabled)
# Requires 'invocation' feature to create JVMs
jni = { version = "0.21", features = ["invocation"], optional = true }

[features]
# Default to JNI backend - works cross-platform
default = ["jni-backend"]

# JNI backend - primary backend for cross-platform deployments
jni-backend = ["dep:jni"]
